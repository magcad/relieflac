name: Relever la cote du lac

# L'API EDF ne renvoie aucun en-tête CORS : elle est inappelable depuis la page
# publiée. Ce job la relève côté serveur et commite le résultat dans le site.
on:
  schedule:
    - cron: "7 * * * *"   # toutes les heures (heure UTC, décalée pour éviter la minute 0)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: level
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relever la cote
        run: python tools/fetch_level.py

      - name: Commiter si la cote a changé
        run: |
          if git diff --quiet -- data/level.json data/level-history.json; then
            echo "cote inchangée, rien à commiter"
            exit 0
          fi
          level=$(python -c "import json;print(json.load(open('data/level.json'))['level_m_ngf'])")
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/level.json data/level-history.json
          git commit -m "cote du lac : ${level} m NGF"
          git push
